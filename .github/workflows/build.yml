name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk epub-audiobook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: epub-audiobook-apk
          path: epub-audiobook.apk
      - name: Publish "latest" release with the APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest epub-audiobook.apk --title "Latest build" --notes "Debug APK built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
